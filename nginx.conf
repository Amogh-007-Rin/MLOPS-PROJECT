server {
    listen 80;

    # 1. Frontend: Proxy to the Vite development server
    # (Or point to /usr/share/nginx/html if using a production build)
    location / {
        proxy_pass http://client:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Backend: Proxy requests starting with /api to FastAPI
    location /api {
        # 'server' matches the service name in docker-compose.yml
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. FastAPI Docs (Swagger)
    location /docs {
        proxy_pass http://server:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://server:8000/openapi.json;
    }
}