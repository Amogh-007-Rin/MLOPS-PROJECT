server {
    listen 80;

    # 1. Frontend: Proxy to the Vite development server
    location / {
        proxy_pass http://client:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Backend: Proxy requests starting with /api to FastAPI
    location /api {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. FastAPI Docs (Swagger)
    location /docs {
        proxy_pass http://server:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://server:8000/openapi.json;
    }

    # 4. WebSocket layer (Rust sockets service)
    location /ws {
        proxy_pass http://sockets:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
