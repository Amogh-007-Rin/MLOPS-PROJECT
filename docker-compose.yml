services:
  nginx:
    image: nginx:alpine
    container_name: mlops_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    # No need to expose ports to host, Nginx handles it internally

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    volumes:
      - ./Dataset:/app/Dataset # Mount datasets so the API can read them
    # Connects to your existing Postgres/Redis services here

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  postgres_data: